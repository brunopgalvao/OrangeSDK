[package]
name = "kernel"
description = "The reference kernel: the Simplex driver and an EVM state transition"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[features]
# Builds the next kernel version, which the upgrade tests switch a running chain to.
upgrade-test = []

[dependencies]
solo-guest = { path = "../solo-guest" }
solo-abi = { path = "../../crates/solo-abi", default-features = false }
solo-rlp = { path = "../../crates/solo-rlp", default-features = false }
solo-eth = { path = "../../crates/solo-eth", default-features = false }
solo-upgrade = { path = "../../crates/solo-upgrade", default-features = false }
revm = { version = "43.0.3", default-features = false }
