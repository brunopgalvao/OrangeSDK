# Guest workspace: programs compiled for the Solo VM. Kept separate from the
# host workspace because everything here targets riscv64imac-unknown-none-elf.
[workspace]
resolver = "2"
members = ["solo-guest", "solo-module", "hello", "kernel", "modules/counter"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
codegen-units = 1
debug = true

[profile.dev]
panic = "abort"
