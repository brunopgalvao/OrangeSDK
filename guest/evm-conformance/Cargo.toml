[package]
name = "evm-conformance"
description = "Runs one Ethereum state test case through the reference kernel's EVM code, for the conformance harness"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "evm-conformance"
path = "src/main.rs"
test = false
bench = false

# The same dependencies, at the same versions and features, as the kernel,
# whose EVM, native-contract, module, state and transaction modules this
# program compiles.
[dependencies]
orange-guest = { path = "../orange-guest" }
orange-abi = { path = "../../crates/orange-abi", default-features = false }
orange-rlp = { path = "../../crates/orange-rlp", default-features = false }
orange-eth = { path = "../../crates/orange-eth", default-features = false }
orange-upgrade = { path = "../../crates/orange-upgrade", default-features = false }
revm = { version = "43.0.3", default-features = false, features = ["optional_eip3607", "optional_no_base_fee"] }
# revm's keccak256 through the host (`precompiles::native_keccak256`, spec 19 §4).
alloy-primitives = { version = "1.7.3", default-features = false, features = ["native-keccak"] }
