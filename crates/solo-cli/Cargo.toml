[package]
name = "solo-cli"
description = "The solo command: run a dev node with JSON-RPC"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "solo"
path = "src/main.rs"

[dependencies]
solo-abi = { path = "../solo-abi" }
solo-node = { path = "../solo-node" }
solo-host = { path = "../solo-host" }
solo-recompile = { path = "../solo-recompile" }
solo-rpc = { path = "../solo-rpc" }
solo-metrics = { path = "../solo-metrics" }
solo-rlp = { path = "../solo-rlp" }
solo-upgrade = { path = "../solo-upgrade" }
serde_json = "1"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }

[dev-dependencies]
solo-rpc = { path = "../solo-rpc" }

[lints]
workspace = true
