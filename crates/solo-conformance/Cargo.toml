[package]
name = "solo-conformance"
description = "Runs Ethereum execution-spec state tests through the Solo pipeline: the kernel's EVM recompiled to a Solo module, on the interpreter and the native backend (spec 07 §4.2)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "solo-conformance"
path = "src/main.rs"
test = false
bench = false

[dependencies]
solo-abi = { path = "../solo-abi" }
solo-host = { path = "../solo-host" }
solo-recompile = { path = "../solo-recompile" }
solo-eth = { path = "../solo-eth" }
solo-rlp = { path = "../solo-rlp" }
solo-vm = { path = "../solo-vm" }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }

[lints]
workspace = true
