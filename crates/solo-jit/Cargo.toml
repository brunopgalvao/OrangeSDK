[package]
name = "solo-jit"
description = "Native code backend for the Solo VM: compiles a validated program ahead of time and runs it in-process, bit-exact with the reference interpreter"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
solo-vm = { path = "../solo-vm" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
solo-recompile = { path = "../solo-recompile" }
tiny-keccak = { version = "2", features = ["keccak"] }

[lints]
workspace = true
