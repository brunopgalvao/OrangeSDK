[package]
name = "solo-eth"
description = "Ethereum transaction decoding, signing payloads, intrinsic gas, logs blooms, block headers, receipts and Merkle-Patricia roots, no_std"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
std = ["solo-abi/std", "solo-rlp/std"]

[dependencies]
solo-abi = { path = "../solo-abi", default-features = false }
solo-rlp = { path = "../solo-rlp", default-features = false }

[dev-dependencies]
alloy-consensus = { version = "1.8.3", default-features = false, features = ["k256"] }
alloy-eips = { version = "1.8.3", default-features = false, features = ["k256"] }
alloy-primitives = "1.7.3"
alloy-rlp = "0.3"
alloy-trie = { version = "0.9", default-features = false, features = ["ethereum"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
serde_json = "1"
solo-fuzz = { path = "../solo-fuzz" }
tiny-keccak = { version = "2", features = ["keccak"] }

[lints]
workspace = true
