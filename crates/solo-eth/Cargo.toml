[package]
name = "solo-eth"
description = "Ethereum transaction decoding, signing payloads, intrinsic gas and logs blooms, no_std"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
std = []

[dependencies]
solo-rlp = { path = "../solo-rlp", default-features = false }

[dev-dependencies]
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
tiny-keccak = { version = "2", features = ["keccak"] }

[lints]
workspace = true
