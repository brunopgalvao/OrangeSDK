[package]
name = "solo-node"
description = "Hosts a Solo kernel: privileged host functions, the driver loop, mempool and queries"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
solo-abi = { path = "../solo-abi" }
solo-eth = { path = "../solo-eth" }
solo-host = { path = "../solo-host" }
solo-trie = { path = "../solo-trie" }
solo-store = { path = "../solo-store" }
solo-metrics = { path = "../solo-metrics" }
solo-vm = { path = "../solo-vm" }
solo-upgrade = { path = "../solo-upgrade" }
solo-bls = { path = "../solo-bls" }
solo-rlp = { path = "../solo-rlp" }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
getrandom = "0.3"

[features]
# `Node::inject_store_fault`, over the store's own `fault-injection`: the
# crash-recovery tests drop a block's write on purpose. The tests below turn
# it on; no release build has it.
fault-injection = ["solo-store/fault-injection"]

[dev-dependencies]
solo-scratch = { path = "../solo-scratch" }
solo-node = { path = ".", features = ["fault-injection"] }
proptest = { version = "1", default-features = false, features = ["std"] }
solo-recompile = { path = "../solo-recompile" }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
solo-ethlc = { path = "../solo-ethlc", features = ["testing"] }

[lints]
workspace = true
