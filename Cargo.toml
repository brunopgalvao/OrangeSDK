[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["guest"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
debug = 1
lto = "thin"

# Pairing arithmetic is impractically slow unoptimized; test and coverage
# builds compile the curve crates with optimizations.
[profile.dev.package.bls12_381]
opt-level = 3

[profile.dev.package.ark-bls12-381]
opt-level = 3

[profile.dev.package.ark-ec]
opt-level = 3

[profile.dev.package.ark-ff]
opt-level = 3
