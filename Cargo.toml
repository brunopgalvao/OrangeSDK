[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["guest"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
debug = 1
lto = "thin"

# Signature signing and recovery dominate consensus tests and debug nodes; unoptimized
# curve arithmetic costs milliseconds per signature (about 10x more than optimized),
# enough to make real-time tests miss view timeouts on a loaded machine.
[profile.dev.package.k256]
opt-level = 3

[profile.dev.package.ecdsa]
opt-level = 3

[profile.dev.package.elliptic-curve]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3

# Pairing arithmetic is impractically slow unoptimized; test and coverage
# builds compile the curve crates with optimizations.
[profile.dev.package.bls12_381]
opt-level = 3

[profile.dev.package.ark-bls12-381]
opt-level = 3

[profile.dev.package.ark-ec]
opt-level = 3

[profile.dev.package.ark-ff]
opt-level = 3

# The precompile host functions (spec 05 §4.8) run revm's backends; the bn254
# and modular-exponentiation arithmetic is as slow unoptimized as pairings.
[profile.dev.package.ark-bn254]
opt-level = 3

[profile.dev.package.aurora-engine-modexp]
opt-level = 3

[profile.dev.package.revm-precompile]
opt-level = 3
