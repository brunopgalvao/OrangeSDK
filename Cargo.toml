[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["guest"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
debug = 1
lto = "thin"

# Signature signing and recovery dominate consensus tests and debug nodes; unoptimized
# curve arithmetic costs milliseconds per signature (about 10x more than optimized),
# enough to make real-time tests miss view timeouts on a loaded machine.
[profile.dev.package.k256]
opt-level = 3

[profile.dev.package.ecdsa]
opt-level = 3

[profile.dev.package.elliptic-curve]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3
