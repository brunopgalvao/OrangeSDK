# The container alternative to orange-node.service: one node per host from the
# image ops/Dockerfile builds, with the same layout and node.env, run by
# orange-host as systemd would run it. On the host:
#
#   docker build -f ops/Dockerfile -t orange:<release> .     # or load a published image
#   ORANGE_IMAGE=orange:<release> docker compose -f compose.node.yml up -d
#
# /etc/orange (node.env, genesis.json, kernel.elf, keys/) is mounted read-only
# and /var/lib/orange is the data directory, owned by ORANGE_UID. Host
# networking: the node binds the addresses node.env names (p2p public, RPC
# private) exactly as on bare metal, and the firewall notes of README.md
# apply unchanged.
name: orange-node

services:
  orange:
    image: ${ORANGE_IMAGE:-orange:devnet}
    network_mode: host
    restart: unless-stopped
    user: "${ORANGE_UID:-10001}:${ORANGE_GID:-10001}"
    entrypoint: ["/bin/bash", "/opt/orange/bin/orange-host", "run"]
    environment:
      ORANGE_BIN: /usr/local/bin/orange
      ORANGE_SERVICE: process
    volumes:
      - /etc/orange:/etc/orange:ro
      - /var/lib/orange:/var/lib/orange
      - /opt/orange/bin/orange-host:/opt/orange/bin/orange-host:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
