# A Prometheus configuration for OrangeSDK nodes (spec 11). Each node serves
# GET /metrics on its JSON-RPC address (`--rpc`, 127.0.0.1:8545 by default).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: orange
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:8545
