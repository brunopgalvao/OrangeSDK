# The Prometheus configuration of docker-compose.yml: the four devnet nodes
# by service name, the alert rules of alerts.yml. prometheus.yml is the
# single-node configuration for a node on this machine.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: orange
    metrics_path: /metrics
    static_configs:
      - targets:
          - orange-0:8545
          - orange-1:8545
          - orange-2:8545
          - orange-3:8545
